<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Супер Мусик Квиз 💕</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pastelBg: '#FFF0F5',
                        pastelCard: '#FFFFFF',
                        pastelPink: '#FFB6C1',
                        pastelDeepPink: '#FF69B4',
                        pastelAccent: '#FF1493',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Предотвращение случайного выделения текста при долгом тапе */
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }

        body {
            background: linear-gradient(135deg, #ffe6e8 0%, #fff0f5 50%, #f3e5f5 100%);
            overflow: hidden;
        }

        /* Анимация летающих сердечек */
        @keyframes floatHeart {
            0% { transform: translateY(105vh) scale(0.5) rotate(0deg); opacity: 0.9; }
            100% { transform: translateY(-10vh) scale(1.2) rotate(360deg); opacity: 0; }
        }

        .bg-heart {
            position: absolute;
            pointer-events: none;
            animation: floatHeart 6s linear infinite;
        }

        /* Пульсирующее финальное сердце */
        @keyframes pulseHeart {
            0% { transform: scale(1); filter: drop-shadow(0 10px 15px rgba(255,105,180,0.4)); }
            50% { transform: scale(1.15); filter: drop-shadow(0 20px 25px rgba(255,20,147,0.6)); }
            100% { transform: scale(1); filter: drop-shadow(0 10px 15px rgba(255,105,180,0.4)); }
        }

        .heart-pulse {
            animation: pulseHeart 1.2s infinite ease-in-out;
        }

        /* Анимация полета/улетания кнопки НЕТ */
        .fly-away {
            animation: flyAwayAnim 0.7s forwards cubic-bezier(0.6, -0.28, 0.735, 0.045);
        }

        @keyframes flyAwayAnim {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
            50% { transform: translate(-30px, -20px) rotate(-15deg) scale(1.1); opacity: 0.9; }
            100% { transform: translate(-150vw, -100px) rotate(-90deg) scale(0.3); opacity: 0; }
        }

        /* Появление новой кнопки Да */
        .fade-in-yes {
            animation: fadeInYesAnim 0.5s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes fadeInYesAnim {
            0% { opacity: 0; transform: scale(0.5) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Прогресс зажатия (SVG circle stroke) */
        .progress-rect {
            transition: stroke-dashoffset 0.08s linear;
        }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center font-sans antialiased relative overflow-hidden select-none">

    <!-- Фоновые анимированные сердечки -->
    <div id="heartsBg" class="absolute inset-0 pointer-events-none z-0"></div>

    <!-- Главная карточка Квиза -->
    <main id="mainCard" class="relative z-10 w-11/12 max-w-md bg-white/85 backdrop-blur-md rounded-3xl p-6 shadow-2xl border border-white/60 text-center transition-all duration-500">
        
        <!-- Прогресс барометр -->
        <div class="w-full bg-pink-100 rounded-full h-2.5 mb-6 overflow-hidden">
            <div id="progressBar" class="bg-gradient-to-r from-pink-400 to-rose-500 h-2.5 rounded-full transition-all duration-300" style="width: 10%"></div>
        </div>

        <div class="text-xs font-semibold text-pink-400 tracking-wider uppercase mb-1" id="questionCounter">
            Вопрос 1 из 10
        </div>

        <!-- Вопрос -->
        <div id="questionContainer" class="min-h-[70px] flex items-center justify-center mb-4">
            <h1 id="questionText" class="text-2xl font-black text-pink-600 tracking-wide leading-tight transition-opacity duration-300">
                ты мой мусик?
            </h1>
        </div>

        <!-- Зона реакций/анимаций маскота -->
        <div id="mascotArea" class="h-28 mb-4 flex flex-col items-center justify-center relative">
            
            <!-- Основной персонаж -->
            <div id="mascotSVG" class="transition-all duration-300 transform scale-100">
                <svg class="w-20 h-20 text-pink-500 drop-shadow-md" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="35" fill="#FFD1DC" />
                    <!-- Глаза -->
                    <circle id="eyeLeft" cx="40" cy="45" r="4" fill="#333" />
                    <circle id="eyeRight" cx="60" cy="45" r="4" fill="#333" />
                    <!-- Улыбка -->
                    <path id="mouth" d="M 40 58 Q 50 66 60 58" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round" />
                    <!-- Щечки -->
                    <circle cx="33" cy="52" r="4" fill="#FF80AB" opacity="0.7" />
                    <circle cx="67" cy="52" r="4" fill="#FF80AB" opacity="0.7" />
                </svg>
            </div>

            <!-- Сообщение от маскота/реакция -->
            <div id="mascotBubble" class="mt-2 text-xs font-bold text-pink-600 bg-pink-100/90 px-3 py-1.5 rounded-full border border-pink-200 transition-all duration-300 opacity-0 transform translate-y-2 max-w-[90%] truncate">
                Жми и удерживай! ✨
            </div>
        </div>

        <!-- Область кнопок -->
        <div id="buttonsContainer" class="flex flex-col gap-3.5 relative min-h-[130px] justify-center items-center">
            
            <!-- КНОПКА ДА (Осн) -->
            <div id="yesWrapper" class="relative w-full max-w-[240px]">
                <svg class="absolute -top-1 -left-1 w-[calc(100%+8px)] h-[calc(100%+8px)] pointer-events-none z-10" viewBox="0 0 248 56">
                    <rect id="yesProgress" class="progress-rect" x="2" y="2" width="244" height="52" rx="26" fill="none" stroke="#FF1493" stroke-width="4" stroke-dasharray="600" stroke-dashoffset="600" />
                </svg>
                <button id="yesBtn" class="w-full py-3 px-6 bg-gradient-to-r from-pink-400 to-rose-400 hover:from-pink-500 hover:to-rose-500 text-white font-bold text-lg rounded-full shadow-md transform active:scale-95 transition-all flex items-center justify-center gap-2 touch-none select-none">
                    <span>ДА</span>
                    <span class="text-xl">✨</span>
                </button>
            </div>

            <!-- КНОПКА НЕТ -->
            <div id="noWrapper" class="relative w-full max-w-[240px]">
                <svg class="absolute -top-1 -left-1 w-[calc(100%+8px)] h-[calc(100%+8px)] pointer-events-none z-10" viewBox="0 0 248 56">
                    <rect id="noProgress" class="progress-rect" x="2" y="2" width="244" height="52" rx="26" fill="none" stroke="#FF69B4" stroke-width="4" stroke-dasharray="600" stroke-dashoffset="600" />
                </svg>
                <button id="noBtn" class="w-full py-3 px-6 bg-gray-200 text-gray-600 font-bold text-lg rounded-full shadow-sm transform active:scale-95 transition-all flex items-center justify-center gap-2 touch-none select-none">
                    <span>НЕТ</span>
                    <span class="text-xl">🙈</span>
                </button>
            </div>

            <!-- Вторая кнопка ДА (заменяет НЕТ при улете) -->
            <div id="yesReplacerWrapper" class="hidden relative w-full max-w-[240px]">
                <svg class="absolute -top-1 -left-1 w-[calc(100%+8px)] h-[calc(100%+8px)] pointer-events-none z-10" viewBox="0 0 248 56">
                    <rect id="yesReplacerProgress" class="progress-rect" x="2" y="2" width="244" height="52" rx="26" fill="none" stroke="#FF1493" stroke-width="4" stroke-dasharray="600" stroke-dashoffset="600" />
                </svg>
                <button id="yesReplacerBtn" class="w-full py-3 px-6 bg-gradient-to-r from-rose-400 to-pink-500 text-white font-bold text-lg rounded-full shadow-md transform active:scale-95 transition-all flex items-center justify-center gap-2 touch-none select-none">
                    <span>ДА (Конечно!)</span>
                    <span class="text-xl">💖</span>
                </button>
            </div>

        </div>

    </main>

    <!-- Финальный экран -->
    <div id="finalScreen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-pink-100/95 backdrop-blur-xl opacity-0 pointer-events-none transition-opacity duration-700 p-6 text-center">
        <!-- Огромное Сердце -->
        <div class="relative mb-6 heart-pulse cursor-pointer">
            <svg class="w-60 h-60 text-pink-500 drop-shadow-2xl" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
            <div class="absolute inset-0 flex items-center justify-center">
                <span class="text-white text-4xl animate-bounce">👑</span>
            </div>
        </div>

        <h2 class="text-3xl md:text-4xl font-black text-pink-600 tracking-wide leading-tight drop-shadow-sm max-w-sm">
            Ура! Квиз пройден! 🎉
        </h2>
        
        <p id="finalSubText" class="mt-3 text-lg font-bold text-pink-500 max-w-xs">
            Ты официальная Булка Года! Я от тебя балдю! ❤️✨
        </p>

        <button id="restartBtn" class="mt-8 px-8 py-3.5 bg-white text-pink-600 font-extrabold rounded-full shadow-xl hover:bg-pink-50 transition-all active:scale-90">
            Пройти еще раз 🥰
        </button>
    </div>

    <script>
        // Звуковой движок (Web Audio API)
        class SoundEngine {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playPop() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(450, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(850, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            playSuccess() {
                this.init();
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + i * 0.08);
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime + i * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.08 + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + i * 0.08);
                    osc.stop(this.ctx.currentTime + i * 0.08 + 0.25);
                });
            }

            playWhoosh() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }
        }

        const sfx = new SoundEngine();

        // Данные вопросов и реплик
        const questions = [
            { text: "1. ты мой мусик?", customYes: "ну какая ты умничка я балдю" },
            { text: "2. Ты умничка?", customNo: "э... врать нехорошо!" },
            { text: "3. ты сладкая булка?" },
            { text: "4. у тебя самые сочные бубсы?" },
            { text: "5. ты очень умная и веселая девушка?" },
            { text: "6. у тебя самый секси мужчина в мире?", fixedYes: "базару нет тебе повезло" },
            { text: "7. твой мужчина оверлаки эс фак ту дэйтинг ю?", fixedYes: "ну и тут тоже базару нет, вы две лаки кути" },
            { text: "8. у тебя самые красивые глазки?" },
            { text: "9. ты кути эс фак настолько что твой мужчина хочет плакать?" },
            { text: "10. разрешишь ли ты своему кутибою обнимать тебя и жмякать 24/7?" }
        ];

        const randomYesAnswers = [
            "ееееее факты факты)))",
            "Все верно булка!;)",
            "Еееее бадииии дац райт мусик!",
            "Фулл правда",
            "Ну естественна!",
            "Ю гад дэмн райт!",
            "Ихихихи ты такая кути))) все верно!"
        ];

        const randomNoAnswers = [
            "Ну ты... не базарь так кучеряво але...",
            "Это что такое а?(",
            "Я такого не потерплю... неверно!",
            "Да как так то а? Попробуй подумать еще...",
            "Ты... ты походу угараешь да?"
        ];

        let currentQuestionIdx = 0;
        const HOLD_DURATION = 1200; // 1.2 сек удерживания
        let isProcessing = false;

        // Элементы UI
        const questionText = document.getElementById('questionText');
        const questionCounter = document.getElementById('questionCounter');
        const progressBar = document.getElementById('progressBar');
        const mascotBubble = document.getElementById('mascotBubble');
        const mascotSVG = document.getElementById('mascotSVG');
        const mouth = document.getElementById('mouth');

        const yesWrapper = document.getElementById('yesWrapper');
        const yesBtn = document.getElementById('yesBtn');
        const yesProgress = document.getElementById('yesProgress');

        const noWrapper = document.getElementById('noWrapper');
        const noBtn = document.getElementById('noBtn');
        const noProgress = document.getElementById('noProgress');

        const yesReplacerWrapper = document.getElementById('yesReplacerWrapper');
        const yesReplacerBtn = document.getElementById('yesReplacerBtn');
        const yesReplacerProgress = document.getElementById('yesReplacerProgress');

        const mainCard = document.getElementById('mainCard');
        const finalScreen = document.getElementById('finalScreen');
        const restartBtn = document.getElementById('restartBtn');
        const heartsBg = document.getElementById('heartsBg');

        // Создание плавающих сердец
        function createBackgroundHearts() {
            heartsBg.innerHTML = '';
            const icons = ['💖', '🌸', '✨', '💕', '💗', '🍬'];
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'bg-heart text-xl md:text-2xl';
                heart.innerText = icons[Math.floor(Math.random() * icons.length)];
                heart.style.left = `${Math.random() * 100}%`;
                heart.style.animationDuration = `${4 + Math.random() * 5}s`;
                heart.style.animationDelay = `${Math.random() * 5}s`;
                heartsBg.appendChild(heart);
            }
        }
        createBackgroundHearts();

        // Случайный выбор из массива
        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        // Показ реплики маскота
        function showBubble(text, isError = false) {
            mascotBubble.innerText = text;
            mascotBubble.className = `mt-2 text-xs font-bold px-3 py-1.5 rounded-full border transition-all duration-300 opacity-100 transform translate-y-0 max-w-[95%] shadow-sm ${
                isError ? 'bg-rose-100 text-rose-600 border-rose-300' : 'bg-pink-100 text-pink-600 border-pink-200'
            }`;
            
            // Эмоция маскота
            if (isError) {
                mouth.setAttribute('d', 'M 40 64 Q 50 54 60 64'); // Удивленный/грустный ротик
            } else {
                mouth.setAttribute('d', 'M 40 58 Q 50 68 60 58'); // Веселая улыбка
            }
        }

        function resetMascot() {
            mascotBubble.classList.add('opacity-0', 'translate-y-2');
            mouth.setAttribute('d', 'M 40 58 Q 50 66 60 58');
        }

        // Универсальный обработчик зажатия кнопки
        function bindHoldEvent(btnElement, progressCircle, onComplete) {
            let holdStartTime = 0;
            let animFrame = null;
            const maxOffset = 600;

            const startHold = (e) => {
                e.preventDefault();
                if (isProcessing) return;

                if (navigator.vibrate) navigator.vibrate(35);
                sfx.playPop();

                holdStartTime = Date.now();

                const loop = () => {
                    const elapsed = Date.now() - holdStartTime;
                    const progress = Math.min(elapsed / HOLD_DURATION, 1);
                    progressCircle.style.strokeDashoffset = maxOffset - (maxOffset * progress);

                    if (progress < 1) {
                        animFrame = requestAnimationFrame(loop);
                    } else {
                        cancelAnimationFrame(animFrame);
                        if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
                        onComplete();
                    }
                };

                animFrame = requestAnimationFrame(loop);
            };

            const stopHold = () => {
                if (isProcessing) return;
                cancelAnimationFrame(animFrame);
                progressCircle.style.strokeDashoffset = maxOffset;
            };

            btnElement.addEventListener('touchstart', startHold, { passive: false });
            btnElement.addEventListener('touchend', stopHold);
            btnElement.addEventListener('touchcancel', stopHold);

            btnElement.addEventListener('mousedown', startHold);
            btnElement.addEventListener('mouseup', stopHold);
            btnElement.addEventListener('mouseleave', stopHold);
        }

        // Логика нажатия ДА
        function handleYesClick() {
            if (isProcessing) return;
            isProcessing = true;
            sfx.playSuccess();

            const q = questions[currentQuestionIdx];
            let responseText = "";

            if (q.customYes) {
                responseText = q.customYes;
            } else if (q.fixedYes) {
                responseText = q.fixedYes;
            } else {
                responseText = getRandom(randomYesAnswers);
            }

            showBubble(responseText, false);

            // Анимация подпрыгивания маскота
            mascotSVG.classList.add('animate-bounce');

            setTimeout(() => {
                mascotSVG.classList.remove('animate-bounce');
                nextQuestion();
            }, 1600);
        }

        // Логика нажатия НЕТ (кнопка улетает, появляется вторая ДА)
        function handleNoClick() {
            if (isProcessing) return;
            sfx.playWhoosh();

            const q = questions[currentQuestionIdx];
            let errorText = q.customNo ? q.customNo : getRandom(randomNoAnswers);

            showBubble(errorText, true);

            // Анимация улетания кнопки НЕТ
            noWrapper.classList.add('fly-away');

            setTimeout(() => {
                noWrapper.classList.add('hidden');
                noWrapper.classList.remove('fly-away');

                // Показываем подменную рабочую кнопку ДА
                yesReplacerWrapper.classList.remove('hidden');
                yesReplacerWrapper.classList.add('fade-in-yes');
            }, 600);
        }

        // Переход к следующему вопросу
        function nextQuestion() {
            currentQuestionIdx++;

            if (currentQuestionIdx >= questions.length) {
                // Завершение квиза
                if (window.confetti) {
                    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                }
                mainCard.classList.add('opacity-0', 'scale-90');
                setTimeout(() => {
                    finalScreen.classList.remove('opacity-0', 'pointer-events-none');
                    finalScreen.classList.add('opacity-100', 'pointer-events-auto');
                }, 500);
                return;
            }

            // Обновляем карточку
            questionText.classList.add('opacity-0');

            setTimeout(() => {
                const q = questions[currentQuestionIdx];
                questionText.innerText = q.text;
                questionCounter.innerText = `Вопрос ${currentQuestionIdx + 1} из 10`;
                progressBar.style.width = `${((currentQuestionIdx + 1) / 10) * 100}%`;

                // Сброс кнопок
                noWrapper.classList.remove('hidden');
                yesReplacerWrapper.classList.add('hidden');
                yesReplacerWrapper.classList.remove('fade-in-yes');

                yesProgress.style.strokeDashoffset = 600;
                noProgress.style.strokeDashoffset = 600;
                yesReplacerProgress.style.strokeDashoffset = 600;

                resetMascot();
                questionText.classList.remove('opacity-0');
                isProcessing = false;
            }, 300);
        }

        // Инициализация кнопок
        bindHoldEvent(yesBtn, yesProgress, handleYesClick);
        bindHoldEvent(noBtn, noProgress, handleNoClick);
        bindHoldEvent(yesReplacerBtn, yesReplacerProgress, handleYesClick);

        restartBtn.addEventListener('click', () => {
            location.reload();
        });
    </script>
</body>
</html>
